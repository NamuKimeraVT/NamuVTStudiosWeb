<!DOCTYPE html>
<html lang="es">

<head>
    <title>NamuVT Studios - Contacto</title>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light only" />
    <meta property="twitter:card" content="summary_large_image" />
    <link rel="canonical" href="https://namuvtstudios.vercel.app/" />
    <link rel="stylesheet" type="text/css" href="CSS/Estilos.css">
    <link rel="stylesheet" type="text/css" href="CSS/EstilosAnimaciones.css">
    <link rel="icon" type="image/png" href="img/Foto de Perfil.jpg" />
    <link rel="apple-touch-icon" href="img/Foto de Perfil.jpg" />
    <script src="BACKEND/app.py"></script>
    <script src="BACKEND/formulario.js"></script>
    <script src="JS/Animations.js"></script>
    <script src="JS/Footer&Navloader.js"></script>
</head>

<body class="is-loading">
    <div id="nav-container"></div>
    <div class="inner">
        <div>
            <img src="img/LOGO ACTUAL.png" style="width: 50%; margin-left: 25%; margin-right: 25%;" class="animated-photo" data-animation="slide-left">
        </div>
        <p id="texttitlesec1" class="text">Forma de Contacto</p>
        <p id="textp" class="text">
            Usa este formulario para preguntarme lo que quieras, cosas como collabs, trabajo, etc.
        </p>
        <div class="form-container">
            <!-- El id "form-contacto" coincide con el que usaremos en JS -->
            <form id="form-contacto">
                <div class="form-group">
                    <label for="input-nombre">Nombre</label>
                    <input type="text" id="input-nombre" placeholder="Tu nombre completo" required>
                </div>
                <div class="form-group">
                    <label for="input-correo">Correo Electrónico</label>
                    <input type="email" id="input-correo" placeholder="ejemplo@correo.com" required>
                </div>
                <div class="form-group">
                    <label for="input-mensaje">Mensaje</label>
                    <textarea id="input-mensaje" placeholder="Escribe tu mensaje aquí..." required></textarea>
                </div>
                <button type="submit" class="btn-enviar">Enviar Mensaje</button>
            </form>
        </div>
    </div>
    <div id="footer-container"></div>
</body>
</html>
